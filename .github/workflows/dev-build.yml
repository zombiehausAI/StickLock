name: Dev & Feature Build

on:
  push:
    branches:
      - dev
      - 'feature/**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (Dev/Feature)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test StickLock.Tests/StickLock.Tests.csproj --configuration Release --nologo -v normal

      - name: Extract Build Version
        id: version
        shell: pwsh
        run: |
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          $ver = "$($json.major).$($json.minor).$($json.patch)-dev.$($json.devBuild)"
          Write-Host "Building Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish Self-Contained App
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $cleanNumeric = "1.1.0"
          if ($ver -match '^(\d+\.\d+(\.\d+)?)') {
              $cleanNumeric = $Matches[1]
          }
          dotnet publish StickLock.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            "-p:Version=$cleanNumeric" `
            "-p:AssemblyVersion=$cleanNumeric" `
            "-p:FileVersion=$cleanNumeric" `
            "-p:InformationalVersion=$ver" `
            -o artifacts/staging/StickLock

      - name: Build & Pack StickLock.SDK
        run: >
          dotnet pack StickLock.SDK/StickLock.SDK.csproj
          --configuration Release
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -o artifacts

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Compile Installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          $ver = "${{ steps.version.outputs.version }}"
          Write-Host "Compiling installer with $iscc for version $ver..."
          & $iscc /DMyAppVersion="$ver" installer/StickLock.iss

      - name: Create Portable Zip & Checksums
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $zip = "artifacts/StickLock-v$ver-win-x64.zip"
          Compress-Archive -Path "artifacts/staging/StickLock/*" -DestinationPath $zip -Force
          Get-FileHash -Path artifacts/StickLock-v* | ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content artifacts/checksums.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StickLock-v${{ steps.version.outputs.version }}
          path: |
            artifacts/StickLock-v*-Setup.exe
            artifacts/StickLock-v*-win-x64.zip
            artifacts/checksums.sha256
            artifacts/StickLock.SDK.*.nupkg
          if-no-files-found: error

