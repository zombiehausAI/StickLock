name: Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test StickLock.Tests/StickLock.Tests.csproj --configuration Release --nologo -v normal

      - name: Extract Release Version
        id: version
        shell: pwsh
        run: |
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          $ver = "$($json.major).$($json.minor).$($json.patch)"
          Write-Host "Building Release Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish Self-Contained App
        run: >
          dotnet publish StickLock.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:GitBranch=main
          -o artifacts/staging/StickLock

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Compile Installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          $ver = "${{ steps.version.outputs.version }}"
          Write-Host "Compiling installer with $iscc for version $ver..."
          & $iscc /DMyAppVersion="$ver" installer/StickLock.iss

      - name: Create Portable Zip & Checksums
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $zip = "artifacts/StickLock-v$ver-win-x64.zip"
          Compress-Archive -Path "artifacts/staging/StickLock/*" -DestinationPath $zip -Force
          Get-FileHash -Path artifacts/StickLock-v* | ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content artifacts/checksums.sha256

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickLock-v${{ steps.version.outputs.version }}-Setup
          path: artifacts/StickLock-v*-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: StickLock v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/StickLock-v*-Setup.exe
            artifacts/StickLock-v*-win-x64.zip
            artifacts/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
