name: Release Build

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test StickLock.Tests/StickLock.Tests.csproj --configuration Release --nologo -v normal

      - name: Extract Release Version
        id: version
        shell: pwsh
        run: |
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          $ver = "$($json.major).$($json.minor).$($json.patch)"
          Write-Host "Building Release Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish Self-Contained App
        run: >
          dotnet publish StickLock.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:GitBranch=release
          -o artifacts/staging/StickLock

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Compile Installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          $ver = "${{ steps.version.outputs.version }}"
          Write-Host "Compiling installer with $iscc for version $ver..."
          & $iscc /DMyAppVersion="$ver" installer/StickLock.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickLock-v${{ steps.version.outputs.version }}-Setup
          path: artifacts/StickLock-v*-Setup.exe
          if-no-files-found: error

