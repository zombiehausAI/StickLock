<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="space-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A10"/>
    </radialGradient>

    <!-- Stick Shading Gradients -->
    <linearGradient id="stick-chassis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="stick-head" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="base-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243048"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="accent-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Sci-Fi / MFD HUD Background -->
  <rect width="1200" height="750" fill="url(#space-grad)"/>

  <!-- Tactical Grid & Framing Lines -->
  <g stroke="#00E5FF" stroke-opacity="0.08" stroke-width="1">
    <line x1="50" y1="50" x2="1150" y2="50"/>
    <line x1="50" y1="710" x2="1150" y2="710"/>
    <line x1="50" y1="50" x2="50" y2="710"/>
    <line x1="1150" y1="50" x2="1150" y2="710"/>

    <line x1="400" y1="50" x2="400" y2="710"/>
    <line x1="770" y1="50" x2="770" y2="710"/>
  </g>

  <!-- Corner Tech Brackets -->
  <g stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 50,75 L 50,50 L 75,50"/>
    <path d="M 1150,75 L 1150,50 L 1125,50"/>
    <path d="M 50,685 L 50,710 L 75,710"/>
    <path d="M 1150,685 L 1150,710 L 1125,710"/>
  </g>

  <!-- Header Branding Bar -->
  <text x="590" y="36" fill="#00E5FF" font-size="14" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="4" text-anchor="middle">
    VKB GLADIATOR EVO RIGHT SCHEMATIC
  </text>
  <text x="590" y="52" fill="#64748B" font-size="10" font-weight="600" font-family="system-ui, sans-serif" letter-spacing="2" text-anchor="middle">
    KOSMOSIMA SCG SPACE COMBAT GRIP + EVO BASE
  </text>

  <!-- ================= FLIGHT CONTROLLER ILLUSTRATION ================= -->
  <!-- Base Plate & Gimbal Ring -->
  <g>
    <!-- Base Plate -->
    <path d="M 430,685 L 750,685 L 775,695 L 775,705 L 405,705 L 405,695 Z" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.5"/>
    
    <!-- Base Housing -->
    <path d="M 435,560 L 745,560 L 760,685 L 420,685 Z" fill="url(#base-grad)" stroke="#38BDF8" stroke-width="1.8"/>

    <!-- Base Chamfer Accent Lines -->
    <line x1="445" y1="585" x2="735" y2="585" stroke="#1E293B" stroke-width="2"/>
    <line x1="435" y1="620" x2="745" y2="620" stroke="#1E293B" stroke-width="2"/>

    <!-- Base Buttons (F3, F1, F2) -->
    <rect x="525" y="565" width="28" height="14" rx="3" fill="#1E293B" stroke="#00E5FF" stroke-width="1.2"/>
    <text x="539" y="576" fill="#94A3B8" font-size="8" font-weight="700" text-anchor="middle">F3</text>

    <rect x="575" y="565" width="28" height="14" rx="3" fill="#1E293B" stroke="#00E5FF" stroke-width="1.2"/>
    <text x="589" y="576" fill="#94A3B8" font-size="8" font-weight="700" text-anchor="middle">F1</text>

    <rect x="625" y="565" width="28" height="14" rx="3" fill="#1E293B" stroke="#00E5FF" stroke-width="1.2"/>
    <text x="639" y="576" fill="#94A3B8" font-size="8" font-weight="700" text-anchor="middle">F2</text>

    <!-- Base Encoders & Slider -->
    <!-- En1 Knob (Left) -->
    <circle cx="510" cy="635" r="16" fill="#1E293B" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="510" cy="635" r="8" fill="#0B0F19"/>
    <line x1="510" y1="622" x2="510" y2="648" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="510" y="662" fill="#64748B" font-size="8" font-weight="700" text-anchor="middle">EN1</text>

    <!-- Slider (Center) -->
    <rect x="575" y="615" width="28" height="40" rx="4" fill="#0B0F19" stroke="#38BDF8" stroke-width="1.2"/>
    <rect x="580" y="630" width="18" height="10" rx="2" fill="#00E5FF"/>
    <text x="589" y="668" fill="#64748B" font-size="8" font-weight="700" text-anchor="middle">SLIDER</text>

    <!-- En2 Knob (Right) -->
    <circle cx="665" cy="635" r="16" fill="#1E293B" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="665" cy="635" r="8" fill="#0B0F19"/>
    <line x1="665" y1="622" x2="665" y2="648" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="665" y="662" fill="#64748B" font-size="8" font-weight="700" text-anchor="middle">EN2</text>

    <!-- Gimbal Boot (Rubber Gaiter) -->
    <path d="M 535,540 C 535,520 645,520 645,540 C 655,555 655,560 645,560 L 535,560 Z" fill="#111827" stroke="#374151" stroke-width="1.5"/>

    <!-- Grip Shaft & Palm Rest -->
    <path d="M 565,340 
             C 555,420 540,490 550,530 
             L 630,530 
             C 635,490 625,420 615,340 Z" 
          fill="url(#stick-chassis)" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Palm Rest & Pinky Shelf -->
    <path d="M 530,460 L 645,460 L 650,478 L 525,478 Z" fill="#334155" stroke="#00E5FF" stroke-width="1.2"/>
    <rect x="532" y="445" width="16" height="12" rx="3" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="540" y="454" fill="#00E5FF" font-size="7" font-weight="800" text-anchor="middle">D1</text>

    <!-- Kosmosima SCG Grip Head Assembly -->
    <path d="M 545,340 
             C 525,320 505,260 520,180 
             C 530,130 580,105 625,115 
             C 665,125 675,180 665,240 
             C 655,300 635,335 615,340 Z" 
          fill="url(#stick-head)" stroke="#00E5FF" stroke-width="2"/>

    <!-- Grip Head Faceplate Overlay -->
    <path d="M 540,165 C 550,135 620,135 640,165 C 650,210 645,260 630,300 L 555,300 C 540,260 535,210 540,165 Z"
          fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Left Controls on Grip Head -->
    <!-- POV Hat (Top Left) -->
    <circle cx="550" cy="155" r="15" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="550" cy="155" r="8" fill="#334155"/>

    <!-- A2 Weapon Release Red Button -->
    <circle cx="545" cy="210" r="12" fill="#DC2626" stroke="#EF4444" stroke-width="2"/>
    <circle cx="545" cy="210" r="6" fill="#F87171"/>
    <text x="545" y="213" fill="#FFFFFF" font-size="7" font-weight="900" text-anchor="middle">A2</text>

    <!-- B1 Side Upper Button -->
    <rect x="520" y="275" width="16" height="14" rx="3" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="528" y="285" fill="#00E5FF" font-size="7" font-weight="800" text-anchor="middle">B1</text>

    <!-- Triggers (Primary Fire & SpeedFire) -->
    <!-- Primary Trigger (Dual Stage) -->
    <path d="M 522,350 C 495,360 495,405 522,415 L 530,395 C 518,390 518,375 530,370 Z" fill="#0F172A" stroke="#00E5FF" stroke-width="1.8"/>
    <!-- SpeedFire Secondary Rapid Trigger -->
    <path d="M 524,320 C 490,325 490,345 520,348 Z" fill="#DC2626" stroke="#EF4444" stroke-width="1.5"/>

    <!-- Right Controls on Grip Head (A4, A3, C1) -->
    <!-- A4 Top Hat -->
    <g transform="translate(615, 145)">
      <circle cx="0" cy="0" r="18" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5"/>
      <path d="M -5,-5 L 5,-5 L 8,0 L 5,5 L -5,5 L -8,0 Z" fill="#334155" stroke="#38BDF8" stroke-width="1"/>
      <text x="0" y="3" fill="#00E5FF" font-size="8" font-weight="800" text-anchor="middle">A4</text>
    </g>

    <!-- A3 Center Hat -->
    <g transform="translate(620, 220)">
      <circle cx="0" cy="0" r="18" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5"/>
      <rect x="-8" y="-8" width="16" height="16" rx="3" fill="#334155" stroke="#38BDF8" stroke-width="1"/>
      <text x="0" y="3" fill="#00E5FF" font-size="8" font-weight="800" text-anchor="middle">A3</text>
    </g>

    <!-- C1 Thumb Hat -->
    <g transform="translate(640, 290)">
      <circle cx="0" cy="0" r="18" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="9" fill="#334155" stroke="#38BDF8" stroke-width="1"/>
      <text x="0" y="3" fill="#00E5FF" font-size="8" font-weight="800" text-anchor="middle">C1</text>
    </g>
  </g>

  <!-- ================= LEADER LINES (CYAN HUD TRACKS) ================= -->
  <g stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.65" fill="none">
    <!-- Left Rail Leader Lines -->
    <polyline points="320,95 440,95 535,205"/>        <!-- to A2 Red Button -->
    <polyline points="320,150 430,150 515,280"/>       <!-- to B1 Upper Side Button -->
    <polyline points="320,205 450,205 530,450"/>       <!-- to D1 Pinky Button -->
    <polyline points="320,265 440,265 500,330"/>       <!-- to SpeedFire Push -->
    <polyline points="320,320 440,320 500,340"/>       <!-- to SpeedFire Pull -->
    <polyline points="320,380 430,380 505,375"/>       <!-- to Fire 1 (Stage 1) -->
    <polyline points="320,435 430,435 510,405"/>       <!-- to Fire 2 (Stage 2) -->
    <polyline points="320,495 480,495 530,565"/>       <!-- to Base F3 Button -->
    <polyline points="320,555 470,555 580,630"/>       <!-- to Base Slider -->
    <polyline points="320,615 450,615 505,628"/>       <!-- to En1 Encoder UP -->
    <polyline points="320,670 450,670 515,645"/>       <!-- to En1 Encoder DOWN -->

    <!-- Right Rail Leader Lines (A4 Hat) -->
    <polyline points="740,70 655,70 622,130"/>         <!-- to A4 Hat UP -->
    <polyline points="740,115 660,115 615,138"/>       <!-- to A4 Hat LEFT / CLICK -->
    <polyline points="960,70 700,70 630,140"/>         <!-- to A4 Hat RIGHT -->
    <polyline points="960,115 700,115 625,160"/>       <!-- to A4 Hat DOWN -->

    <!-- Right Rail Leader Lines (A3 Hat) -->
    <polyline points="740,225 680,225 632,210"/>       <!-- to A3 Hat UP -->
    <polyline points="740,270 670,270 615,220"/>       <!-- to A3 Hat LEFT / CLICK -->
    <polyline points="960,225 710,225 635,220"/>       <!-- to A3 Hat RIGHT -->
    <polyline points="960,270 710,270 625,235"/>       <!-- to A3 Hat DOWN -->

    <!-- Right Rail Leader Lines (C1 Hat) -->
    <polyline points="740,380 700,380 650,280"/>       <!-- to C1 Hat UP -->
    <polyline points="740,425 690,425 635,290"/>       <!-- to C1 Hat LEFT / CLICK -->
    <polyline points="960,380 720,380 655,290"/>       <!-- to C1 Hat RIGHT -->
    <polyline points="960,425 720,425 645,305"/>       <!-- to C1 Hat DOWN -->

    <!-- Right Rail Leader Lines (Base Buttons & En2) -->
    <polyline points="740,535 680,535 595,565"/>       <!-- to Base F1 Button -->
    <polyline points="960,535 730,535 645,565"/>       <!-- to Base F2 Button -->
    <polyline points="740,600 690,600 658,628"/>       <!-- to En2 Encoder UP -->
    <polyline points="960,600 730,600 672,645"/>       <!-- to En2 Encoder DOWN -->
  </g>

  <!-- ================= CALLOUT BOX ANCHORS (SLOTS FOR HTML BADGES) ================= -->
  <!-- Left Column Header -->
  <text x="220" y="68" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">TRIGGERS &amp; GRIP CONTROLS</text>

  <!-- Left Callout Box Outlines (Visual Backdrops for Interactive Badges) -->
  <g stroke="#1E293B" stroke-width="1.2" fill="#0B0F19" fill-opacity="0.8" rx="4">
    <rect x="75" y="78" width="230" height="34" rx="4"/>
    <rect x="75" y="133" width="230" height="34" rx="4"/>
    <rect x="75" y="188" width="230" height="34" rx="4"/>
    <rect x="75" y="248" width="230" height="34" rx="4"/>
    <rect x="75" y="303" width="230" height="34" rx="4"/>
    <rect x="75" y="363" width="230" height="34" rx="4"/>
    <rect x="75" y="418" width="230" height="34" rx="4"/>
    <rect x="75" y="478" width="230" height="34" rx="4"/>
    <rect x="75" y="538" width="230" height="34" rx="4"/>
    <rect x="75" y="598" width="230" height="34" rx="4"/>
    <rect x="75" y="653" width="230" height="34" rx="4"/>
  </g>

  <!-- Right Section Headers -->
  <text x="895" y="48" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">A4 HAT (TOP)</text>
  <text x="895" y="203" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">A3 HAT (CENTER)</text>
  <text x="895" y="358" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">C1 HAT (THUMB)</text>
  <text x="895" y="513" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">BASE CONTROLS</text>

  <!-- Right Callout Box Outlines (Columns R1 & R2) -->
  <g stroke="#1E293B" stroke-width="1.2" fill="#0B0F19" fill-opacity="0.8">
    <!-- A4 Hat Rows -->
    <rect x="730" y="53" width="200" height="34" rx="4"/>
    <rect x="940" y="53" width="200" height="34" rx="4"/>
    <rect x="730" y="98" width="200" height="34" rx="4"/>
    <rect x="940" y="98" width="200" height="34" rx="4"/>
    <rect x="730" y="143" width="200" height="34" rx="4"/>

    <!-- A3 Hat Rows -->
    <rect x="730" y="208" width="200" height="34" rx="4"/>
    <rect x="940" y="208" width="200" height="34" rx="4"/>
    <rect x="730" y="253" width="200" height="34" rx="4"/>
    <rect x="940" y="253" width="200" height="34" rx="4"/>
    <rect x="730" y="298" width="200" height="34" rx="4"/>

    <!-- C1 Hat Rows -->
    <rect x="730" y="363" width="200" height="34" rx="4"/>
    <rect x="940" y="363" width="200" height="34" rx="4"/>
    <rect x="730" y="408" width="200" height="34" rx="4"/>
    <rect x="940" y="408" width="200" height="34" rx="4"/>
    <rect x="730" y="453" width="200" height="34" rx="4"/>

    <!-- Base Rows -->
    <rect x="730" y="518" width="200" height="34" rx="4"/>
    <rect x="940" y="518" width="200" height="34" rx="4"/>
    <rect x="730" y="583" width="200" height="34" rx="4"/>
    <rect x="940" y="583" width="200" height="34" rx="4"/>
  </g>
</svg>
