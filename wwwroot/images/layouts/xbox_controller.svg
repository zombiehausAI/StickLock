<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <radialGradient id="body-grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </radialGradient>
    <linearGradient id="bumper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="stick-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Controller Outline / Shell -->
  <path d="M 270,120 
           C 360,110 640,110 730,120 
           C 780,125 830,170 850,230 
           C 885,340 920,490 855,570 
           C 810,620 720,570 660,450 
           C 600,420 400,420 340,450 
           C 280,570 190,620 145,570 
           C 80,490 115,340 150,230 
           C 170,170 220,125 270,120 Z" 
        fill="url(#body-grad)" stroke="#00E5FF" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- Left / Right Bumpers (LB & RB) -->
  <path d="M 230,115 C 270,95 380,90 440,105 L 435,130 C 370,120 270,120 235,135 Z" 
        fill="url(#bumper-grad)" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 770,115 C 730,95 620,90 560,105 L 565,130 C 630,120 730,120 765,135 Z" 
        fill="url(#bumper-grad)" stroke="#38BDF8" stroke-width="2"/>

  <!-- Left / Right Triggers (LT & RT) -->
  <path d="M 240,88 C 270,70 340,65 380,72 L 375,92 C 340,85 275,90 245,102 Z" 
        fill="#0F172A" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 760,88 C 730,70 660,65 620,72 L 625,92 C 660,85 725,90 755,102 Z" 
        fill="#0F172A" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Xbox Center Nexus / Guide Button -->
  <circle cx="500" cy="190" r="32" fill="#0F172A" stroke="#00E5FF" stroke-width="2.5"/>
  <path d="M 488,180 Q 500,195 512,180 Q 500,205 488,180" fill="#00E5FF"/>

  <!-- View and Menu Buttons -->
  <circle cx="430" cy="240" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <circle cx="570" cy="240" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <!-- Share Button -->
  <circle cx="500" cy="280" r="11" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>

  <!-- Left Thumbstick (Well & Cap) -->
  <circle cx="330" cy="240" r="62" fill="#0B0F19" stroke="#334155" stroke-width="2"/>
  <circle cx="330" cy="240" r="48" fill="url(#stick-grad)" stroke="#00E5FF" stroke-width="2"/>

  <!-- D-Pad (Cross Base & Facets) -->
  <g transform="translate(420, 360)">
    <rect x="-18" y="-55" width="36" height="110" rx="6" fill="#1E293B" stroke="#00E5FF" stroke-width="2"/>
    <rect x="-55" y="-18" width="110" height="36" rx="6" fill="#1E293B" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#0B0F19"/>
  </g>

  <!-- Right Thumbstick (Well & Cap) -->
  <circle cx="580" cy="380" r="62" fill="#0B0F19" stroke="#334155" stroke-width="2"/>
  <circle cx="580" cy="380" r="48" fill="url(#stick-grad)" stroke="#00E5FF" stroke-width="2"/>

  <!-- ABXY Face Buttons Cluster -->
  <g transform="translate(680, 240)">
    <!-- X Button (Left - Blue) -->
    <circle cx="-50" cy="0" r="22" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <text x="-50" y="7" fill="#38BDF8" font-size="20" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">X</text>

    <!-- Y Button (Top - Yellow) -->
    <circle cx="0" cy="-50" r="22" fill="#1E293B" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="0" y="-43" fill="#FBBF24" font-size="20" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">Y</text>

    <!-- B Button (Right - Red) -->
    <circle cx="50" cy="0" r="22" fill="#1E293B" stroke="#F87171" stroke-width="2.5"/>
    <text x="50" y="7" fill="#F87171" font-size="20" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">B</text>

    <!-- A Button (Bottom - Green) -->
    <circle cx="0" cy="50" r="22" fill="#1E293B" stroke="#34D399" stroke-width="2.5"/>
    <text x="0" y="57" fill="#34D399" font-size="20" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">A</text>
  </g>

  <!-- Labels -->
  <text x="500" y="620" fill="#64748B" font-size="14" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" letter-spacing="3">XBOX WIRELESS CONTROLLER</text>
</svg>

